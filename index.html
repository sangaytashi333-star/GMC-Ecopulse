    <script>
      (function() {
        // AI Studio environment constraint: HMR is disabled.
        // Intercept Vite HMR WebSocket so it never emits "WebSocket closed without opened".
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(e) {
            if (e && (e.message || '').includes('WebSocket')) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
            if (reason.includes('WebSocket')) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);

          var _origConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var str = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
            if (str.includes('WebSocket') || str.includes('vite-hmr') || (str.includes('[vite]') && str.includes('closed'))) {
              return;
            }
            _origConsoleError.apply(console, args);
          };

          if (window.WebSocket) {
            var RealWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')))) {
                return {
                  readyState: 1, // OPEN
                  url: url,
                  protocol: 'vite-hmr',
                  binaryType: 'blob',
                  bufferedAmount: 0,
                  extensions: '',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  close: function() {},
                  send: function() {},
                  addEventListener: function(event, handler) {
                    if (event === 'open') {
                      setTimeout(function() {
                        try { handler({ type: 'open' }); } catch (_) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; }
                };
              }
              return new RealWebSocket(url, protocols);
            };
            window.WebSocket.prototype = RealWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        }
      })();
    </script>
