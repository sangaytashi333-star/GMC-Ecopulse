<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="50%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c14" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="50%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#95d5b2" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c430" />
      <stop offset="100%" stop-color="#e9a822" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle pulse rings -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#52b788" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="270" r="150" fill="none" stroke="#52b788" stroke-width="2.5" stroke-opacity="0.25" />
  <circle cx="256" cy="270" r="110" fill="none" stroke="#e9a822" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Himalayan Mountain Silhouette -->
  <path d="M 64 380 L 160 250 L 230 330 L 310 210 L 400 340 L 448 380 Z" fill="#183b2c" fill-opacity="0.7" />
  <path d="M 110 380 L 210 260 L 270 330 L 350 240 L 420 380 Z" fill="#204e3b" fill-opacity="0.8" />

  <!-- Mountain Snowcaps -->
  <path d="M 310 210 L 290 240 L 305 245 L 315 250 L 325 242 L 330 235 Z" fill="#ffffff" fill-opacity="0.85" />
  <path d="M 210 260 L 195 285 L 210 288 L 222 280 Z" fill="#ffffff" fill-opacity="0.85" />

  <!-- Sacred EcoPulse Heart / Lotus Leaf -->
  <g transform="translate(256, 270) scale(1.15)">
    <!-- Central Vitality Pulse Node -->
    <path d="M 0 -85 C 45 -45 65 0 65 40 C 65 75 40 95 0 95 C -40 95 -65 75 -65 40 C -65 0 -45 -45 0 -85 Z" fill="url(#leafGrad)" filter="url(#glow)" />
    <!-- Inner Lotus Leaf Vein / Pulse Spine -->
    <path d="M 0 -70 L 0 80" stroke="#0f291e" stroke-width="4" stroke-linecap="round" />
    <path d="M 0 -30 Q 25 -20 40 0" fill="none" stroke="#0f291e" stroke-width="3" stroke-linecap="round" />
    <path d="M 0 -10 Q -25 0 -40 20" fill="none" stroke="#0f291e" stroke-width="3" stroke-linecap="round" />
    <path d="M 0 20 Q 25 30 38 48" fill="none" stroke="#0f291e" stroke-width="3" stroke-linecap="round" />

    <!-- Golden Mindfulness Jewel at top -->
    <circle cx="0" cy="-96" r="10" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Orbiting Ecological Dots -->
    <circle cx="-32" cy="-90" r="4.5" fill="#95d5b2" />
    <circle cx="32" cy="-90" r="4.5" fill="#95d5b2" />
  </g>

  <!-- GMC Text Emblem below -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#d8f3dc" text-anchor="middle" fill-opacity="0.9">GELEPHU ECOPULSE</text>
  <text x="256" y="475" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" letter-spacing="4" fill="#e9a822" text-anchor="middle" fill-opacity="0.8">GMC BIOSPHERE MESH</text>
</svg>
